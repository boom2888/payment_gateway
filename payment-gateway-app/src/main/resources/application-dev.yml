code:
  expireTime: 10  # 验证码有效时长(分钟)
--- # mail 邮件发送
mail:
  enabled: true
  host: smtp.gmail.com
  port: 587
  # 是否需要用户名密码验证
  auth: true
  from: ucard@koalaplatform.com
  user: ucard@koalaplatform.com
  pass: ${MAIL_PASSWORD:}
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0
# 数据源配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://47.130.110.155:3306/pay_gw?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true
        username: pay_gw
        password: ${DB_PASSWORD:}
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  data:
    # redis 配置
    redis:
    # 地址
      host: 127.0.0.1
    # 端口，默认为6379
      port: 6379
    # 数据库索引
      database: 9
    # 密码
      password: ${REDIS_PASSWORD:}
    # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
        # 连接池中的最小空闲连接
          min-idle: 0
        # 连接池中的最大空闲连接
          max-idle: 8
        # 连接池的最大数据库连接数
          max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
